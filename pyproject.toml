[build-system]
requires = ["setuptools>=78,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "r08-constitutional-kernel"
version = "0.1.2a1"
description = "Experimental signed policy kernel with two-party local settlement"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md", "r08/vendor/LICENSE.*.txt"]
authors = [{name = "RUSSELL PHILIP SMITHSON"}]
dependencies = ["cryptography>=50.0.1,<51"]

[tool.setuptools.packages.find]
include = ["r08*"]

[tool.setuptools.package-data]
"r08.vendor" = ["LICENSE.*.txt"]
